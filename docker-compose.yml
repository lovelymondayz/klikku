services:
  postgres:
    image: postgres:16-alpine
    container_name: klikku-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-klikku}
      POSTGRES_USER: ${DB_USER:-klikku}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-klikku}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5440}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-klikku}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  immich:
    image: ghcr.io/immich-app/immich-server:v1.120.0
    container_name: klikku-immich
    restart: unless-stopped
    environment:
      DB_HOSTNAME: immich-postgres
      DB_USERNAME: immich
      DB_PASSWORD: immich_secure_2026
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich-redis
      JWT_SECRET: immich_jwt_secret_change_me_in_production_min_32_chars
      UPLOAD_LOCATION: ./library
    volumes:
      - immich_data:/usr/src/app/upload
    ports:
      - "8081:8080"
    depends_on:
      - immich-postgres
      - immich-redis
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  immich-postgres:
    image: tensorchord/pgvecto-rs:pg16-v0.2.0
    container_name: klikku-immich-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: immich
      POSTGRES_PASSWORD: immich_secure_2026
      POSTGRES_DB: immich
    volumes:
      - immich_pg_data:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  immich-redis:
    image: redis:7-alpine
    container_name: klikku-immich-redis
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: klikku-backend
    restart: unless-stopped
    env_file:
      - backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      immich:
        condition: service_started
    ports:
      - "${BACKEND_PORT:-8083}:8083"
    volumes:
      - storage_data:/app/storage
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8083/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: klikku-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3009}:80"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  storage_data:
  immich_data:
  immich_pg_data:
